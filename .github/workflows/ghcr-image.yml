name: GHCR Image

on:
  push:
    branches:
      - main
      - beta
    # 纯文档改动不触发构建；其余提交自动触发 CI
    # "**.md" 覆盖任意层级的 markdown（"*.md" 只匹配仓库根目录）
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck / build
        run: npm run build

  check_ghcr_image:
    name: Build image (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

  build_ghcr_image:
    name: Publish image (${{ matrix.arch }})
    # push 与手动触发都发布镜像；PR 只走上面的 check（push: false）
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 不用 docker/metadata-action：避免 GitHub API Unicorn HTML 导致整 job 失败
      - name: Image tags (arch)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_name}"
          ref_name="${GITHUB_REF_NAME}"
          arch="${{ matrix.arch }}"

          tags=()
          tags+=("${image}:${ref_name}-${arch}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/beta" ]]; then
            tags+=("${image}:latest-${arch}")
          fi

          {
            echo "image=${image}"
            echo "version=${ref_name}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Image: ${image}"
          echo "Tags:"
          printf '  %s\n' "${tags[@]}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CIALLO_BUILD_ID=${{ github.sha }}
            CIALLO_TRACK_REF=${{ github.ref_name }}
            CIALLO_GITHUB_REPO=${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

  merge:
    name: Merge multi-arch image
    if: github.event_name != 'pull_request'
    needs:
      - build_ghcr_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags (manifest)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_name}"
          ref_name="${GITHUB_REF_NAME}"

          tags=()
          tags+=("${image}:${ref_name}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/beta" ]]; then
            tags+=("${image}:latest")
          fi

          {
            echo "image=${image}"
            echo "version=${ref_name}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Manifest tags:"
          printf '  %s\n' "${tags[@]}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Creating manifest: $tag"
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
