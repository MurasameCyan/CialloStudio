name: ciallo-studio

services:
  ciallo-studio:
    container_name: ciallo-studio
    image: ghcr.io/murasamecyan/ciallostudio:beta
    pull_policy: always
    ports:
      - "${CIALLO_PORT:-8080}:8080"
    environment:
      # 站长账号（.env）。密码明文仅容器环境；前端只拿 sha256
      CIALLO_MASTER_USERNAME: ${CIALLO_MASTER_USERNAME:-admin}
      CIALLO_MASTER_PASSWORD: ${CIALLO_MASTER_PASSWORD:-${CIALLO_ADMIN_PASSWORD:-}}
      CIALLO_MEDIA_BASE: ${CIALLO_MEDIA_BASE:-}
      CIALLO_MEDIA_UPLOAD_TOKEN: ${CIALLO_MEDIA_UPLOAD_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
