name: ciallo-studio

services:
  ciallo-studio:
    container_name: ciallo-studio
    image: ${CIALLO_IMAGE:-ghcr.io/murasamecyan/ciallostudio:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CIALLO_PORT:-8080}:8080"
    environment:
      # 上游 grok2api / OpenAI 兼容网关根地址（不要带 /v1 也行）
      CIALLO_UPSTREAM: ${CIALLO_UPSTREAM:-https://grokb.yuzu.gv.uy}
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
