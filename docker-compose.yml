name: ciallo-studio

services:
  ciallo-studio:
    container_name: ciallo-studio
    # 固定使用 GHCR beta；不本地 build
    image: ghcr.io/murasamecyan/ciallostudio:beta
    pull_policy: always
    ports:
      - "${CIALLO_PORT:-8080}:8080"
    environment:
      # 管理页解锁密码（.env）。留空 = 不设门禁
      CIALLO_ADMIN_PASSWORD: ${CIALLO_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
