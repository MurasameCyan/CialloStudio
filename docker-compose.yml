name: ciallo-studio

services:
  ciallo-studio:
    container_name: ciallo-studio
    image: ghcr.io/murasamecyan/ciallostudio:beta
    pull_policy: always
    ports:
      - "${CIALLO_PORT:-8080}:8080"
    # 与上游 API（如 grok2api）跑在同一台机器时，可加入同一个 Docker 网络，
    # 直接用容器名互访（http://grok2api:8000/v1），上游就不必对宿主机暴露端口。
    # 要用的话：本块和文件末尾的顶层 networks 必须一起解注释，否则 compose 报错。
    # 同时把该 origin 加进 CIALLO_UPSTREAM_ALLOWLIST，否则会被上游白名单拦掉。
    # networks:
    #   - ai-internal
    environment:
      # 站长账号（.env）。密码明文仅容器环境；前端只拿 sha256
      CIALLO_MASTER_USERNAME: ${CIALLO_MASTER_USERNAME:-admin}
      CIALLO_MASTER_PASSWORD: ${CIALLO_MASTER_PASSWORD:-}
      CIALLO_MEDIA_BASE: ${CIALLO_MEDIA_BASE:-}
      CIALLO_MEDIA_UPLOAD_TOKEN: ${CIALLO_MEDIA_UPLOAD_TOKEN:-}
      CIALLO_SITE_BASE: ${CIALLO_SITE_BASE:-}
      CIALLO_QUEUE_STORAGE_MODE: ${CIALLO_QUEUE_STORAGE_MODE:-}
      # 上游白名单：本机/内网 API（逗号分隔 origin 或 host）
      CIALLO_UPSTREAM_ALLOWLIST: ${CIALLO_UPSTREAM_ALLOWLIST:-}
      # GET /debug/upstream?url= 校验上游（1=开，0=关）
      CIALLO_DEBUG_UPSTREAM: ${CIALLO_DEBUG_UPSTREAM:-1}
      # 社区数据持久化目录（容器内）；volume 挂到宿主机
      CIALLO_DATA_DIR: /data
      CIALLO_COMMUNITY_MODE: ${CIALLO_COMMUNITY_MODE:-http}
      CIALLO_COMMUNITY_API_BASE: ${CIALLO_COMMUNITY_API_BASE:-/api/community}
      # 创作台「模板」默认词库地址（空 = 用户自己导入）。见 .env.example
      CIALLO_PROMPT_TEMPLATES_URL: ${CIALLO_PROMPT_TEMPLATES_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 用户 / 帖子 / 会话 / 冷却配置 保存在此 volume
      - ciallo-data:/data
      # 镜像不内置默认词库；需要提供词库时解开下面挂载
      # - ./prompt-templates.json:/usr/share/nginx/html/prompt-templates.json:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ciallo-data:
    name: ciallo-studio-data

# 与服务里的 networks 成对使用，见上方说明。
# external: true 表示这个网络由外部创建、compose 不负责创建也不删除，
# 所以解注释前先建好：docker network create ai-internal
# （通常这个网络已经由上游 API 那份 compose 建好了，直接接入即可）
# networks:
#   ai-internal:
#     external: true
