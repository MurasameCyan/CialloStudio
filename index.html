<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="light dark" />
    <title>Ciallo Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='14' fill='white' fill-opacity='.9'/%3E%3C/svg%3E" />
    <!-- FOUC: Graphite dark/light -->
    <script>
      try {
        var t = localStorage.getItem("ciallo-studio.theme.v2") || localStorage.getItem("ciallo-studio.theme.v1");
        var light = t === "light" || t === "graphite-light" || t === "classic";
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", light ? "#f4f6fa" : "#0f1115");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <!-- Docker entrypoint 会覆盖 /runtime-config.js；本地 dev 用 public/ 默认无门禁 -->
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
