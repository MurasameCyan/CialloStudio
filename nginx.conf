worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # 精简 access：无 UA；静态资源 / runtime-config / healthz 不记
  log_format ciallo_short '$remote_addr $request_method $status $body_bytes_sent "$request_uri"';
  map $request_uri $ciallo_access_loggable {
    default                 1;
    ~*\.(js|css|map|ico|png|jpe?g|gif|webp|svg|woff2?|ttf|eot)(\?|$)  0;
    ~*^/runtime-config\.js  0;
    ~*^/healthz             0;
  }

  # 动态上游：优先请求头 X-Ciallo-Upstream，否则 cookie ciallo_upstream
  # （<img src="/v1/media/..."> 无法自定义头，靠 cookie）
  resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 头优先；空则用 cookie（URL 编码的 origin）
  map $http_x_ciallo_upstream $ciallo_upstream_raw {
    default $http_x_ciallo_upstream;
    ""      $cookie_ciallo_upstream;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 常见：access → stdout；仅记录非静态请求
    access_log /dev/stdout ciallo_short if=$ciallo_access_loggable;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # 社区 API → 容器内 Node（用户/帖子持久化到 /data volume）
    location /api/community/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://127.0.0.1:8090;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location = /api/community {
      return 301 /api/community/;
    }

    location /v1/ {
      # cookie 可能是 encodeURIComponent 后的值，nginx 原样用作 URL 通常仍可用
      # 若头/cookie 都空
      set $ciallo_upstream $ciallo_upstream_raw;

      if ($ciallo_upstream = "") {
        add_header Content-Type "application/json; charset=utf-8" always;
        return 400 '{"error":{"message":"缺少上游。请在管理页填写 API Base URL 并测试连接一次（会写入 cookie）。","code":"missing_upstream_header"}}';
      }

      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_ssl_name $proxy_host;
      proxy_pass $ciallo_upstream$request_uri;
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }

    location = /v1 {
      return 301 /v1/;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }
  }
}
