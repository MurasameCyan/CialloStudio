worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # 精简 access：无 UA；仅 4xx/5xx（2xx/3xx 成功请求不刷屏）
  log_format ciallo_short '$remote_addr $request_method $status $body_bytes_sent "$request_uri"';
  map $status $ciallo_access_loggable {
    ~^[45]  1;
    default 0;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 常见：access → stdout；仅 4xx/5xx
    access_log /dev/stdout ciallo_short if=$ciallo_access_loggable;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # 社区 API → 容器内 Node（用户/帖子持久化到 /data volume）
    location /api/community/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://127.0.0.1:8090;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location = /api/community {
      return 301 /api/community/;
    }

    # 服务端任务队列（VIP/站长后台生图）
    location /api/tasks/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://127.0.0.1:8092;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      client_max_body_size 16m;
    }

    location = /api/tasks {
      return 301 /api/tasks/;
    }

    # /v1 动态上游：Node 代理 + SSRF 防护（仍允许用户自定义公网 API）
    # 上游来自 X-Ciallo-Upstream / cookie ciallo_upstream，由 v1-proxy 校验后转发
    location /v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # 其余请求头（Authorization / Content-Type / Cookie / X-Ciallo-Upstream）默认透传
      proxy_set_header Connection "";
      proxy_pass http://127.0.0.1:8091;
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }

    location = /v1 {
      return 301 /v1/;
    }

    # 上游 SSRF 校验调试（CIALLO_DEBUG_UPSTREAM=0 可关）
    location = /debug/upstream {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Ciallo-Upstream $http_x_ciallo_upstream;
      proxy_set_header Cookie $http_cookie;
      proxy_pass http://127.0.0.1:8091;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }

    location = /api/upstream-check {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Ciallo-Upstream $http_x_ciallo_upstream;
      proxy_set_header Cookie $http_cookie;
      proxy_pass http://127.0.0.1:8091;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }
  }
}
