worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  # 容器内可写临时目录（非 root 友好）
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # 变量 proxy_pass 需要显式 resolver；请求时再解析 DNS
  # 避免启动时因占位域名 / 临时 DNS 失败导致 nginx -t 崩溃
  # 127.0.0.11 = Docker 内置 DNS；其余为公共解析兜底
  resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # entrypoint 注入：0=正常反代，1=未配置真实上游（返回 JSON 说明）
  map ${CIALLO_UPSTREAM_DISABLED} $ciallo_upstream_disabled {
    default 0;
    "1"     1;
    "true"  1;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态前端（SPA）
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 同源代理 OpenAI 兼容 API
    # 使用变量 + resolver：启动不解析主机名，配置测试可通过
    location /v1/ {
      # 未配置真实上游时直接返回可读错误（页面仍可打开）
      if ($ciallo_upstream_disabled) {
        add_header Content-Type "application/json; charset=utf-8" always;
        return 503 '{"error":{"message":"CIALLO_UPSTREAM 未配置或仍是占位域名。请在 .env 设置真实 grok2api 地址后 docker compose up -d","code":"upstream_not_configured"}}';
      }

      # ${CIALLO_UPSTREAM_ORIGIN} 由 entrypoint 写入，如 https://api.example.com（无尾斜杠、无 /v1）
      set $ciallo_upstream_origin "${CIALLO_UPSTREAM_ORIGIN}";

      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_ssl_name $proxy_host;
      # 变量形式：完整 URI 原样转发到上游（/v1/models → https://host/v1/models）
      proxy_pass $ciallo_upstream_origin$request_uri;
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }

    location = /v1 {
      return 301 /v1/;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }
  }
}
