# Ciallo Telegram Media — 配置全部走 CF Variables / Secrets，勿在此写密钥
name = "ciallo-telegram-media"
main = "src/index.ts"
# 纯 Web API（fetch/FormData/Blob），不要 nodejs_compat：
# Pages Direct Upload 往往不会带上 compat flags，带 unenv 的包可能在边缘直接挂掉（表现为 522）
compatibility_date = "2024-11-01"
workers_dev = true

# Secrets（Dashboard Variables / wrangler secret put）：
#   TELEGRAM_BOT_TOKEN   必填
#   TELEGRAM_CHAT_ID     必填
#   UPLOAD_TOKEN         建议
#   ALLOWED_ORIGINS      可选
#
# Variables（非机密）：
#   MAX_UPLOAD_BYTES

[vars]
# 20 MB 是 getFile 的下载上限，也就是本 worker 真正能读回来的上限。
# sendDocument 虽然收 50 MB，但 20–50 MB 的文件存进去就读不回来
# （/v1/media/:id 走 getFile 失败 → 404），所以别往上调。
# 长视频请走 Site 储存直连上游图站，不要过 TG。
MAX_UPLOAD_BYTES = "20971520"
