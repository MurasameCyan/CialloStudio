# Ciallo Telegram Media — 配置全部走 CF Variables / Secrets，勿在此写密钥
name = "ciallo-telegram-media"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Secrets（Dashboard → Settings → Variables and Secrets，或 wrangler secret put）：
#   TELEGRAM_BOT_TOKEN   必填
#   TELEGRAM_CHAT_ID     必填
#   UPLOAD_TOKEN         建议
#   ALLOWED_ORIGINS      可选
#
# Variables（非机密）：
#   MAX_UPLOAD_BYTES

[vars]
MAX_UPLOAD_BYTES = "20971520"
